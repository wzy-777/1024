<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>最后一次带路</title>
<style>
  :root{
    --cyan:#5fc8ff;
    --gold:#ffcf7a;
    --ink:#cfe8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#01070d;overflow:hidden}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }
  #stage{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    background:radial-gradient(120% 85% at 50% 6%, #0a2745 0%, #041423 42%, #01070d 100%);
  }
  #stage::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(78% 68% at 50% 44%, transparent 38%, rgba(0,0,0,.58) 100%);
  }

  header{
    position:relative;z-index:3;
    display:flex;justify-content:space-between;align-items:center;
    padding:20px 40px 15px;
    border-bottom:1px solid rgba(90,180,240,.10);
    font-size:12px;letter-spacing:2px;color:rgba(140,200,240,.58);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:6px;height:6px;border-radius:50%;background:#48e0a0;box-shadow:0 0 10px #48e0a0}
  .meta{display:flex;gap:22px;font-variant-numeric:tabular-nums}

  #mapWrap{
    position:relative;z-index:1;flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;
    padding:8px 36px;
  }
  #map{width:100%;height:100%;display:block}

  footer{
    position:relative;z-index:3;
    min-height:152px;padding:22px 40px 30px;
    border-top:1px solid rgba(90,180,240,.10);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:11px;text-align:center;
  }
  footer .who{font-size:11px;letter-spacing:7px;color:rgba(140,200,240,.42)}
  footer .line{
    font-size:22px;font-weight:300;letter-spacing:1px;line-height:1.6;
    color:#e2f2ff;min-height:34px;max-width:820px;
    text-shadow:0 0 24px rgba(95,200,255,.18);
  }
  footer .hint{font-size:12px;letter-spacing:2px;color:rgba(140,200,240,.5);min-height:30px;display:flex;align-items:center}

  .miniBtn{
    font-family:inherit;font-size:12px;letter-spacing:4px;color:#bfe6ff;
    background:rgba(60,150,220,.08);
    border:1px solid rgba(95,200,255,.35);
    border-radius:2px;padding:7px 22px;cursor:pointer;
    transition:.25s;
  }
  .miniBtn:hover{background:rgba(95,200,255,.18);border-color:rgba(95,200,255,.8);box-shadow:0 0 18px rgba(95,200,255,.25)}

  /* ---------- 地图元素 ---------- */
  .node{cursor:pointer}
  .node .ring{fill:none;stroke:rgba(95,190,255,.42);stroke-width:1;transition:.3s}
  .node .core{fill:rgba(130,215,255,.85);transition:.3s}
  .node text{fill:rgba(150,205,240,.55);font-size:13px;letter-spacing:1.5px;transition:.3s}
  .node.active .ring{stroke:rgba(130,220,255,.9);stroke-width:1.4}
  .node.active:hover .ring{stroke:#9fe0ff;stroke-width:2;filter:url(#blueGlow)}
  .node.active:hover text{fill:#d6efff}
  .node.recorded .ring{stroke:var(--gold);stroke-width:1.6;filter:url(#goldGlow)}
  .node.recorded .core{fill:#ffe3a6}
  .node.recorded text{fill:#f3d7a2}
  .node.ghosted{opacity:.25}

  #trace{fill:none;stroke:rgba(255,207,122,.55);stroke-width:1.2;stroke-dasharray:3 5}

  #fish{transition:opacity .6s}
  #fish .tail{transform-box:fill-box;transform-origin:100% 50%;animation:tail .8s ease-in-out infinite}
  @keyframes tail{0%,100%{transform:rotate(0deg)}50%{transform:rotate(16deg)}}

  .waterFill{opacity:.92}
  #waterLayer{transition:transform 1.9s cubic-bezier(.42,0,.22,1)}

  /* ---------- 遮罩层 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 85% at 50% 8%, #0a2745 0%, #041423 45%, #01070d 100%);
    transition:opacity .8s ease, visibility .8s;
    padding:40px;
  }
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}

  .titleCard{text-align:center;max-width:760px}
  .eyebrow{
    font-size:11px;letter-spacing:8px;color:rgba(140,200,240,.5);
    margin-bottom:26px;
  }
  .titleCard h1{
    font-size:56px;font-weight:200;letter-spacing:14px;color:#e8f5ff;
    text-indent:14px;
    text-shadow:0 0 40px rgba(95,200,255,.35);
    margin-bottom:30px;
  }
  .rule{width:74px;height:1px;background:rgba(95,200,255,.5);margin:0 auto 30px}
  .lede{
    font-size:17px;font-weight:300;line-height:2.1;color:rgba(196,224,246,.85);
    margin-bottom:12px;
  }
  .lede.dim{color:rgba(150,196,230,.55);font-size:15px}
  .titleCard .fine{
    margin-top:38px;font-size:12px;letter-spacing:2px;color:rgba(130,180,215,.42);
  }
  .primaryBtn{
    margin-top:34px;
    font-family:inherit;font-size:14px;letter-spacing:8px;text-indent:8px;
    color:#d7efff;background:rgba(60,150,220,.10);
    border:1px solid rgba(95,200,255,.45);
    padding:15px 54px;cursor:pointer;transition:.3s;
  }
  .primaryBtn:hover{background:rgba(95,200,255,.20);box-shadow:0 0 30px rgba(95,200,255,.28);border-color:rgba(95,200,255,.9)}

  /* ---------- 选择 ---------- */
  .choiceBox{text-align:center}
  .choiceBox h2{
    font-size:32px;font-weight:200;letter-spacing:8px;margin-bottom:14px;color:#e6f4ff;
  }
  .choiceBox .sub{font-size:13px;letter-spacing:2px;color:rgba(140,200,240,.5);margin-bottom:44px}
  .cards{display:flex;gap:26px;justify-content:center;flex-wrap:wrap}
  .card{
    width:268px;padding:18px 18px 22px;
    background:rgba(20,60,95,.16);
    border:1px solid rgba(95,200,255,.22);
    cursor:pointer;transition:.35s;text-align:center;
    font-family:inherit;color:inherit;
  }
  .card:hover{
    border-color:rgba(95,200,255,.75);
    background:rgba(40,110,170,.22);
    box-shadow:0 0 34px rgba(95,200,255,.18);
    transform:translateY(-3px);
  }
  .card .mini{width:232px;height:148px;margin:0 auto 16px;overflow:hidden}
  .card .cardTitle{font-size:17px;letter-spacing:4px;color:#e0f1ff;margin-bottom:8px}
  .card .cardSub{font-size:12px;line-height:1.8;color:rgba(150,196,230,.55);letter-spacing:1px}
  .choiceBox .fine{margin-top:34px;font-size:12px;letter-spacing:2px;color:rgba(130,180,215,.4)}

  /* ---------- 结局 ---------- */
  .endWrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .endSvg{position:absolute;inset:0;width:100%;height:100%}
  .endText{
    position:relative;z-index:2;text-align:center;
    font-size:21px;font-weight:300;letter-spacing:2px;line-height:2.2;color:#e6f3ff;
  }
  .endText p{margin:4px 0}
  .endText .dim{color:rgba(150,196,230,.5)}
  .endText .fin{
    margin-top:34px;font-size:11px;letter-spacing:6px;color:rgba(140,190,225,.35);
  }
  .endWrap .ghostBtn{
    position:absolute;bottom:8%;left:50%;transform:translateX(-50%);
    font-family:inherit;font-size:12px;letter-spacing:4px;color:rgba(180,220,250,.65);
    background:transparent;border:1px solid rgba(95,200,255,.25);
    padding:10px 28px;cursor:pointer;transition:.3s;z-index:3;
  }
  .endWrap .ghostBtn:hover{color:#fff;border-color:rgba(95,200,255,.8);background:rgba(95,200,255,.1)}

  #dbg{
    position:fixed;left:12px;bottom:12px;z-index:99;display:none;
    font:11px/1.6 Consolas,monospace;color:#7fe0ff;
    background:rgba(0,0,0,.75);border:1px solid rgba(95,200,255,.3);
    padding:8px 10px;white-space:pre-wrap;max-width:62vw;pointer-events:none;
  }
</style>
</head>
<body>
<div id="stage">
  <header>
    <div class="brand"><span class="dot"></span><span>潮溪镇 · 最后一夜</span></div>
    <div class="meta">
      <span id="stepLabel">第 1 / 15 步</span>
      <span id="waterLabel">水位 0.0 m</span>
    </div>
  </header>

  <main id="mapWrap">
    <svg id="map" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="koiGrad" cx="35%" cy="35%" r="75%">
          <stop offset="0%" stop-color="#ffe6b8"/>
          <stop offset="45%" stop-color="#ffab52"/>
          <stop offset="100%" stop-color="#e2632a"/>
        </radialGradient>
        <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1d6da8" stop-opacity=".62"/>
          <stop offset="55%" stop-color="#0a3055" stop-opacity=".78"/>
          <stop offset="100%" stop-color="#020d1a" stop-opacity=".95"/>
        </linearGradient>
        <filter id="blueGlow" x="-120%" y="-120%" width="340%" height="340%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="goldGlow" x="-140%" y="-140%" width="380%" height="380%">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g id="gridLayer"></g>
      <g id="roadLayer"></g>
      <g id="pathLayer"><path id="trace" d=""></path></g>
      <g id="nodeLayer"></g>

      <g id="waterLayer" style="transform:translateY(640px)">
        <path class="waterFill" fill="url(#waterGrad)"
          d="M0,0 C160,-9 320,9 500,0 C680,-9 840,9 1000,0 L1000,660 L0,660 Z"/>
        <path fill="none" stroke="rgba(150,228,255,.65)" stroke-width="1.4"
          d="M0,0 C160,-9 320,9 500,0 C680,-9 840,9 1000,0"/>
      </g>

      <g id="fishLayer" opacity="0">
        <g id="fish">
          <path class="tail" d="M-14,0 L-32,-10 Q-25,0 -32,10 Z" fill="#ff9c4a"/>
          <ellipse cx="0" cy="0" rx="17" ry="8.5" fill="url(#koiGrad)"/>
          <path d="M-6,-8 Q11,0 -6,8" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
          <circle cx="11" cy="-2" r="1.6" fill="#20120a"/>
        </g>
      </g>
    </svg>
  </main>

  <footer>
    <div class="who">爷 爷</div>
    <div class="line" id="line"></div>
    <div class="hint" id="hint"></div>
  </footer>
</div>
<div id="dbg"></div>

<div id="titleOverlay" class="overlay">
  <div class="titleCard">
    <div class="eyebrow">潮 溪 镇 · 最 后 一 夜</div>
    <h1>最后一次带路</h1>
    <div class="rule"></div>
    <p class="lede">我爷爷是村里送信的。明天早上四点，水库放水，村子就没了。<br/>他记不住路了，可他还要去送最后一封信。</p>
    <p class="lede dim">他指着一堵墙说“从这儿进去”。我知道那儿是墙，我还是记了。</p>
    <button class="primaryBtn" id="startBtn">开 始 走</button>
    <p class="fine">他说一个地方，你就点地图上那个位置。他说错了，也不能改。</p>
  </div>
</div>

<div id="choiceOverlay" class="overlay hidden">
  <div class="choiceBox">
    <div class="eyebrow">水 要 来 了</div>
    <h2>你只能带走一张</h2>
    <div class="sub">两张纸，你只有一双手</div>
    <div class="cards">
      <button class="card" data-choice="his">
        <div class="mini" id="miniHis"></div>
        <div class="cardTitle">他记得的那张</div>
        <div class="cardSub">歪的。<br/>墙里有个院子。</div>
      </button>
      <button class="card" data-choice="true">
        <div class="mini" id="miniTrue"></div>
        <div class="cardTitle">准确的那张</div>
        <div class="cardSub">对的。<br/>上面没有那个院子。</div>
      </button>
    </div>
    <p class="fine">改了地图，也改不了他的记性。</p>
  </div>
</div>

<div id="endingOverlay" class="overlay hidden"></div>

<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";

  var PLACES = {
    "邮局":   {x:140, y:420},
    "渡口":   {x:110, y:300},
    "石桥":   {x:250, y:390},
    "木桥":   {x:320, y:310},
    "河湾":   {x:200, y:520},
    "老巷口": {x:420, y:360},
    "豆腐坊": {x:500, y:310},
    "晒谷场": {x:610, y:350},
    "井台":   {x:480, y:450},
    "大槐树": {x:660, y:430},
    "祠堂":   {x:760, y:390},
    "那堵墙": {x:850, y:230}
  };

  var ROADS = [
    ["渡口","石桥"],["石桥","木桥"],["石桥","老巷口"],["老巷口","豆腐坊"],
    ["豆腐坊","晒谷场"],["晒谷场","大槐树"],["大槐树","祠堂"],["祠堂","那堵墙"],
    ["井台","大槐树"],["河湾","邮局"],["邮局","石桥"],["井台","豆腐坊"]
  ];

  var ROUNDS = [
    {line:"从邮局出来。",                       target:"邮局"},
    {line:"往东走，过桥。",                     target:"石桥"},
    {line:"第二个路口，往右拐。",               target:"老巷口"},
    {line:"门口晒着东西的那一家。",             target:"晒谷场"},
    {line:"有磨盘的那家。",                     target:"豆腐坊"},
    {line:"井台边上歇一会儿。",                 target:"井台"},
    {line:"往东，树底下。",                     target:"大槐树"},
    {line:"祠堂后头有条小路。",                 target:"祠堂"},
    {line:"拐进去，有个院子。",                 target:"那堵墙", force:"那堵墙", ghost:true},
    {line:"院子门口有三级台阶。",               auto:true},
    {line:"屋里有口水缸。",                     auto:true},
    {line:"……我们回家吧。",                     silent:true},
    {line:"你是哪家的孩子？",                   silent:true},
    {line:"天快亮了。",                         silent:true},
    {line:"你也是来问路的？从邮局走，过桥，第二个路口右拐。", final:true}
  ];

  var GHOST = {x:850, y:230};

  /* ---------------- DOM ---------------- */
  var svg        = document.getElementById("map");
  var gridLayer  = document.getElementById("gridLayer");
  var roadLayer  = document.getElementById("roadLayer");
  var nodeLayer  = document.getElementById("nodeLayer");
  var pathEl     = document.getElementById("trace");
  var fishLayer  = document.getElementById("fishLayer");
  var fish       = document.getElementById("fish");
  var waterLayer = document.getElementById("waterLayer");
  var lineEl     = document.getElementById("line");
  var hintEl     = document.getElementById("hint");
  var stepLabel  = document.getElementById("stepLabel");
  var waterLabel = document.getElementById("waterLabel");
  var titleOv    = document.getElementById("titleOverlay");
  var choiceOv   = document.getElementById("choiceOverlay");
  var endingOv   = document.getElementById("endingOverlay");

  /* ---------------- 状态 ---------------- */
  var idx = 0;
  var records = [];
  var waterY = 640;
  var locked = true;
  var current = null;
  var typeTimer = null;
  var ghostNode = null;
  var fishT = 0;
  var lastLen = 0;

  var DEBUG = /debug/.test(location.search);
  var dbgLines = [];
  function dbg(s){
    if (!DEBUG) return;
    dbgLines.unshift(s);
    if (dbgLines.length > 5) dbgLines.pop();
    var d = document.getElementById("dbg");
    d.style.display = "block";
    d.textContent = dbgLines.join("\n");
  }

  /* ---------------- 建图 ---------------- */
  function el(name, attrs){
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  function buildGrid(){
    var i;
    for (i = 0; i <= 1000; i += 50){
      gridLayer.appendChild(el("line", {x1:i, y1:0, x2:i, y2:640, stroke:"rgba(80,170,235,.05)", "stroke-width":1}));
    }
    for (i = 0; i <= 640; i += 50){
      gridLayer.appendChild(el("line", {x1:0, y1:i, x2:1000, y2:i, stroke:"rgba(80,170,235,.05)", "stroke-width":1}));
    }
    var n = el("text", {x:960, y:44, fill:"rgba(140,200,240,.35)", "font-size":11, "text-anchor":"middle", "letter-spacing":2});
    n.textContent = "N";
    gridLayer.appendChild(n);
    gridLayer.appendChild(el("line", {x1:960, y1:54, x2:960, y2:74, stroke:"rgba(140,200,240,.3)", "stroke-width":1}));
  }

  function buildRoads(){
    ROADS.forEach(function(r){
      var a = PLACES[r[0]], b = PLACES[r[1]];
      if (!a || !b) return;
      roadLayer.appendChild(el("line", {
        x1:a.x, y1:a.y, x2:b.x, y2:b.y,
        stroke:"rgba(90,180,240,.13)", "stroke-width":1, "stroke-dasharray":"2 6"
      }));
    });
  }

  function buildNodes(){
    Object.keys(PLACES).forEach(function(id){
      var p = PLACES[id];
      var g = el("g", {"class":"node", "data-id":id});
      g.appendChild(el("circle", {cx:p.x, cy:p.y, r:26, fill:"transparent"}));
      g.appendChild(el("circle", {cx:p.x, cy:p.y, r:13, "class":"ring"}));
      g.appendChild(el("circle", {cx:p.x, cy:p.y, r:3, "class":"core"}));
      var t = el("text", {x:p.x, y:p.y + 30, "text-anchor":"middle"});
      t.textContent = id;
      g.appendChild(t);
      g.addEventListener("click", function(){ onNodeClick(id); });
      nodeLayer.appendChild(g);
    });
  }

  function nodeById(id){
    return nodeLayer.querySelector('[data-id="' + id + '"]');
  }

  /* ---------------- 水 ---------------- */
  function applyWater(){
    waterLayer.style.transform = "translateY(" + waterY + "px)";
    waterLabel.textContent = "水位 " + ((640 - waterY) / 100).toFixed(1) + " m";
  }

  /* ---------------- 打字 ---------------- */
  function typeLine(text, done){
    clearInterval(typeTimer);
    lineEl.textContent = "";
    hintEl.innerHTML = "";
    locked = true;
    var i = 0;
    typeTimer = setInterval(function(){
      i++;
      lineEl.textContent = text.slice(0, i);
      if (i >= text.length){
        clearInterval(typeTimer);
        if (done) done();
      }
    }, 52);
  }

  function showContinue(label, cb){
    hintEl.innerHTML = "";
    var b = document.createElement("button");
    b.className = "miniBtn";
    b.textContent = label || "继 续";
    b.onclick = function(){
      b.remove();
      if (cb) cb(); else advance();
    };
    hintEl.appendChild(b);
  }

  /* ---------------- 交互 ---------------- */
  function setClickable(allowAll, onlyId){
    Array.prototype.forEach.call(nodeLayer.querySelectorAll(".node"), function(n){
      var id = n.getAttribute("data-id");
      var ok = allowAll && (!onlyId || id === onlyId);
      var isRec = n.classList.contains("recorded");
      n.style.pointerEvents = ok ? "auto" : "none";
      if (ok){
        n.style.opacity = 1;
        n.classList.add("active");
      } else {
        n.classList.remove("active");
        n.style.opacity = isRec ? 1 : (onlyId ? 0.16 : 0.5);
      }
    });
    locked = !allowAll;
    dbg("setClickable allow=" + allowAll + " only=" + onlyId + " locked=" + locked);
  }

  function nearestPlace(x, y){
    var best = null, bd = 1e9;
    Object.keys(PLACES).forEach(function(id){
      var p = PLACES[id];
      var d = Math.sqrt((p.x - x) * (p.x - x) + (p.y - y) * (p.y - y));
      if (d < bd){ bd = d; best = id; }
    });
    return {id:best, d:bd};
  }

  function onNodeClick(id){
    dbg("onNodeClick " + id + " locked=" + locked + " idx=" + idx + " cur=" + (current ? current.line : "null"));
    if (locked || !current) return;
    if (current.force && id !== current.force) return;
    locked = true;

    if (current.force){
      makeGhost();
      pushRecord("院子", GHOST, true, false);
      var wall = nodeById("那堵墙");
      if (wall){
        wall.classList.add("ghosted");
        wall.classList.remove("active");
      }
    } else {
      var p = PLACES[id];
      pushRecord(id, p, false, id === current.target);
      var n = nodeById(id);
      if (n){
        n.classList.add("recorded");
        n.classList.remove("active");
      }
    }
    setClickable(false, null);
    hintEl.textContent = "记下了。";
    setTimeout(advance, 1450);
  }

  function pushRecord(id, p, ghost, correct){
    records.push({id:id, x:p.x, y:p.y, ghost:ghost, correct:correct});
    drawTrace();
  }

  function makeGhost(){
    if (ghostNode) return;
    ghostNode = el("g", {"class":"ghostNode"});
    ghostNode.appendChild(el("rect", {
      x:GHOST.x - 20, y:GHOST.y - 20, width:40, height:40,
      fill:"rgba(255,207,122,.07)",
      stroke:"#ffcf7a", "stroke-width":1.4,
      "stroke-dasharray":"4 4", filter:"url(#goldGlow)"
    }));
    var t = el("text", {x:GHOST.x, y:GHOST.y - 30, "text-anchor":"middle",
      fill:"#ffd98a", "font-size":13, "letter-spacing":2});
    t.textContent = "院子";
    ghostNode.appendChild(t);
    nodeLayer.appendChild(ghostNode);
  }

  function drawTrace(){
    var pts = [];
    records.forEach(function(r){
      var last = pts[pts.length - 1];
      if (last && last.x === r.x && last.y === r.y) return;
      pts.push(r);
    });
    if (pts.length < 2){
      pathEl.setAttribute("d", "");
      if (pts.length === 1){
        fishLayer.setAttribute("opacity", "1");
        fish.setAttribute("transform", "translate(" + pts[0].x + "," + pts[0].y + ")");
      }
      return;
    }
    var d = pts.map(function(p, i){
      return (i ? "L" : "M") + p.x + " " + p.y;
    }).join(" ");
    pathEl.setAttribute("d", d);
    fishLayer.setAttribute("opacity", "1");
  }

  /* ---------------- 鱼 ---------------- */
  var fishAnimating = false;
  function tick(ts){
    requestAnimationFrame(tick);
    if (!records.length) return;
    if (records.length === 1) return;
    var d = pathEl.getAttribute("d");
    if (!d) return;
    var len;
    try { len = pathEl.getTotalLength(); } catch (e){ return; }
    if (len < 1) return;
    if (len !== lastLen){ lastLen = len; if (fishT > len) fishT = len; }
    fishT = Math.min(fishT + 1.5, len);
    var p = pathEl.getPointAtLength(fishT);
    var q = pathEl.getPointAtLength(Math.max(0, fishT - 3));
    var ang = Math.atan2(p.y - q.y, p.x - q.x) * 180 / Math.PI;
    fish.setAttribute("transform", "translate(" + p.x + "," + p.y + ") rotate(" + ang + ")");
  }

  /* ---------------- 回合 ---------------- */
  function startRound(){
    current = ROUNDS[idx];
    stepLabel.textContent = "第 " + (idx + 1) + " / " + ROUNDS.length + " 步";
    setClickable(false, null);

    typeLine(current.line, function(){
      if (current.silent){
        showContinue("继 续");
        return;
      }
      if (current.final){
        showContinue("继 续");
        return;
      }
      if (current.auto){
        setTimeout(function(){
          if (current.auto){
            pushRecord("院子", GHOST, true, false);
          }
          hintEl.textContent = "记下了。";
          setTimeout(advance, 1250);
        }, 700);
        return;
      }
      if (current.force){
        setClickable(true, current.force);
        hintEl.textContent = "他说的是哪儿？";
        return;
      }
      setClickable(true, null);
      hintEl.textContent = "点地图上他说的地方";
    });
  }

  function advance(){
    idx++;
    waterY = Math.max(250, 640 - idx * 26);
    applyWater();
    if (idx >= ROUNDS.length){
      setTimeout(toChoice, 900);
      return;
    }
    setTimeout(startRound, 900);
  }

  /* ---------------- 选择与结局 ---------------- */
  function truePoints(){
    var out = [];
    ROUNDS.forEach(function(r){
      if (r.target && PLACES[r.target] && r.target !== "那堵墙"){
        out.push({x:PLACES[r.target].x, y:PLACES[r.target].y, ghost:false});
      }
    });
    return out;
  }

  function miniMap(points, color, dashed){
    var sx = 232 / 1000, sy = 148 / 640;
    var d = points.map(function(p, i){
      return (i ? "L" : "M") + (p.x * sx).toFixed(1) + " " + (p.y * sy).toFixed(1);
    }).join(" ");
    var s = '<svg viewBox="0 0 232 148" width="232" height="148">';
    s += '<rect width="232" height="148" fill="rgba(10,40,70,.35)" stroke="rgba(95,200,255,.12)"/>';
    for (var gx = 0; gx < 232; gx += 29){
      s += '<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="148" stroke="rgba(95,180,240,.05)"/>';
    }
    for (var gy = 0; gy < 148; gy += 29){
      s += '<line x1="0" y1="' + gy + '" x2="232" y2="' + gy + '" stroke="rgba(95,180,240,.05)"/>';
    }
    if (d) s += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.2" stroke-dasharray="' + dashed + '"/>';
    points.forEach(function(p){
      var cx = (p.x * sx).toFixed(1), cy = (p.y * sy).toFixed(1);
      if (p.ghost){
        s += '<rect x="' + (cx - 3.5) + '" y="' + (cy - 3.5) + '" width="7" height="7" fill="rgba(255,217,138,.25)" stroke="#ffd98a" stroke-width="1" stroke-dasharray="2 2"/>';
      } else {
        s += '<circle cx="' + cx + '" cy="' + cy + '" r="2.2" fill="#8fd6ff"/>';
      }
    });
    s += '</svg>';
    return s;
  }

  function toChoice(){
    lineEl.textContent = "";
    hintEl.innerHTML = "";
    waterY = 250;
    applyWater();

    document.getElementById("miniHis").innerHTML = miniMap(records, "rgba(255,207,122,.8)", "3 4");
    document.getElementById("miniTrue").innerHTML = miniMap(truePoints(), "rgba(140,215,255,.8)", "");
    choiceOv.classList.remove("hidden");
  }

  function endingHis(){
    var s = '<div class="endWrap">';
    s += '<svg class="endSvg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice">';
    s += '<rect width="1000" height="640" fill="#01060c"/>';
    for (var x = 0; x < 1000; x += 50){
      s += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="640" stroke="rgba(70,150,215,.045)"/>';
    }
    for (var y = 0; y < 640; y += 50){
      s += '<line x1="0" y1="' + y + '" x2="1000" y2="' + y + '" stroke="rgba(70,150,215,.045)"/>';
    }
    s += '<rect x="480" y="292" width="40" height="40" fill="rgba(255,207,122,.06)" stroke="#ffcf7a" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#goldGlow)"/>';
    s += '<text x="500" y="278" text-anchor="middle" fill="#ffd98a" font-size="12" letter-spacing="3">院子</text>';
    s += '<g transform="translate(560,312) rotate(-8)">';
    s += '<path class="tail" d="M-14,0 L-32,-10 Q-25,0 -32,10 Z" fill="#ff9c4a"/>';
    s += '<ellipse cx="0" cy="0" rx="17" ry="8.5" fill="url(#koiGrad)"/>';
    s += '<circle cx="11" cy="-2" r="1.6" fill="#20120a"/>';
    s += '</g>';
    s += '</svg>';
    s += '<div class="endText">';
    s += '<p>你带走了他记得的那张。</p>';
    s += '<p class="dim">它是错的。</p>';
    s += '<p>可墙里面，一直有个院子。</p>';
    s += '<p class="fin">凌晨四点，水库合闸 · 完</p>';
    s += '</div>';
    s += '<button class="ghostBtn" onclick="window.__restart()">重 新 走 一 遍</button>';
    s += '</div>';
    return s;
  }

  function endingTrue(){
    var s = '<div class="endWrap">';
    s += '<svg class="endSvg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice">';
    s += '<rect width="1000" height="640" fill="#01060c"/>';
    for (var x = 0; x < 1000; x += 50){
      s += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="640" stroke="rgba(70,150,215,.05)"/>';
    }
    for (var y = 0; y < 640; y += 50){
      s += '<line x1="0" y1="' + y + '" x2="1000" y2="' + y + '" stroke="rgba(70,150,215,.05)"/>';
    }
    var pts = truePoints();
    if (pts.length > 1){
      var d = pts.map(function(p, i){ return (i ? "L" : "M") + p.x + " " + p.y; }).join(" ");
      s += '<path d="' + d + '" fill="none" stroke="rgba(140,215,255,.7)" stroke-width="1.2"/>';
      pts.forEach(function(p){
        s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="2.4" fill="#8fd6ff"/>';
      });
    }
    s += '</svg>';
    s += '<div class="endText">';
    s += '<p>你带走了一张挑不出错的地图。</p>';
    s += '<p class="dim">上面没有那个院子。</p>';
    s += '<p>后来，也没有人再提起它。</p>';
    s += '<p class="fin">凌晨四点，水库合闸 · 完</p>';
    s += '</div>';
    s += '<button class="ghostBtn" onclick="window.__restart()">重 新 走 一 遍</button>';
    s += '</div>';
    return s;
  }

  function showEnding(which){
    choiceOv.classList.add("hidden");
    endingOv.innerHTML = which === "his" ? endingHis() : endingTrue();
    endingOv.classList.remove("hidden");
  }

  /* ---------------- 重置 ---------------- */
  function restart(){
    idx = 0;
    records = [];
    waterY = 640;
    locked = true;
    current = null;
    fishT = 0;
    lastLen = 0;
    clearInterval(typeTimer);

    if (ghostNode){
      ghostNode.remove();
      ghostNode = null;
    }
    Array.prototype.forEach.call(nodeLayer.querySelectorAll(".node"), function(n){
      n.classList.remove("recorded", "active", "ghosted");
      n.style.opacity = 1;
      n.style.pointerEvents = "auto";
    });
    pathEl.setAttribute("d", "");
    fishLayer.setAttribute("opacity", "0");
    fish.setAttribute("transform", "translate(0,0)");

    endingOv.classList.add("hidden");
    endingOv.innerHTML = "";
    choiceOv.classList.add("hidden");
    titleOv.classList.add("hidden");

    applyWater();
    startRound();
  }
  window.__restart = restart;

  /* ---------------- 启动 ---------------- */
  buildGrid();
  buildRoads();
  buildNodes();
  applyWater();

  svg.addEventListener("click", function(ev){
    var rect = svg.getBoundingClientRect();
    var vb = svg.viewBox.baseVal;
    var scale = Math.min(rect.width / vb.width, rect.height / vb.height);
    var ox = (rect.width - vb.width * scale) / 2;
    var oy = (rect.height - vb.height * scale) / 2;
    var x = (ev.clientX - rect.left - ox) / scale;
    var y = (ev.clientY - rect.top - oy) / scale;
    var n = nearestPlace(x, y);
    dbg("svg click " + Math.round(x) + "," + Math.round(y) + " near=" + n.id + " d=" + Math.round(n.d) + " locked=" + locked);
    if (n.d > 48) return;
    onNodeClick(n.id);
  }, true);

  requestAnimationFrame(tick);

  document.getElementById("startBtn").addEventListener("click", function(){
    titleOv.classList.add("hidden");
    startRound();
  });

  Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c){
    c.addEventListener("click", function(){
      showEnding(c.getAttribute("data-choice"));
    });
  });
})();
</script>
</body>
</html>
